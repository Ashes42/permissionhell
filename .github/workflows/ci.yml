name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Full checkout suite
        run: python -m pytest -q
      - name: Compile, check whitespace, build, install wheel and test outside checkout
        run: python scripts/release_check.py --skip-checkout-tests
