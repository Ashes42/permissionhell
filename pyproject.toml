[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permissionhell"
dynamic = ["version"]
description = "Read-only Linux access diagnosis and local-account audits with Unix DAC, POSIX ACLs, and mount restrictions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
permissionhell = "permissionhell:main"

[tool.setuptools]
py-modules = ["permissionhell", "posix_acl", "json_output"]

[tool.setuptools.dynamic]
version = {attr = "permissionhell.__version__"}
