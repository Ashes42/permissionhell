[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permissionhell"
version = "0.2.0"
description = "A read-only Linux effective-access debugger for Unix DAC, POSIX ACLs, and mount restrictions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
permissionhell = "permissionhell:main"

[tool.setuptools]
py-modules = ["permissionhell", "posix_acl"]
